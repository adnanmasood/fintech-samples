<rect x="615" y="155" width="165" height="115" rx="12" fill="#EDF5F5" stroke="#007D82" stroke-width="2"/>
<text class="label" x="697.5" y="189" text-anchor="middle">Acquirer</text>
<text class="body" x="697.5" y="220" text-anchor="middle">Python process</text>
<line x1="780" y1="211" x2="807" y2="211" stroke="#007D82" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="810" y="155" width="165" height="115" rx="12" fill="#EDF5F5" stroke="#007D82" stroke-width="2"/>
<text class="label" x="892.5" y="189" text-anchor="middle">Simulated</text>
