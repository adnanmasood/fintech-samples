<line x1="390" y1="211" x2="417" y2="211" stroke="#007D82" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="155" width="165" height="115" rx="12" fill="#EDF5F5" stroke="#007D82" stroke-width="2"/>
