<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Cloud evolution: local → VM → independent roles</title><desc id="desc">The working local program can run unchanged in one VM container through an SSH tunnel. A future design would replace queues with managed messaging and store ledger and idempotency state durably. Provider mappings are proposals, not deployments.</desc>
