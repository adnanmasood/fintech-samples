<line x1="771" y1="235" x2="828" y2="235" stroke="#007D82" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text class="body" x="35" y="372" text-anchor="start">Stage 3 needs new transport, authenticated traffic, concurrency control, recovery, and separate tests.</text>
