name: Verify course projects
on:
  push:
    branches: [main, publish-course-apps]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/check-publication.py
  algorithms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintech-algorithms
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: fintech-algorithms/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify real browser Python
        run: pnpm exec playwright test tests/browser/guided-labs.spec.ts --grep "real Python"
      - run: pnpm test:notebooks
        env:
          CHROMIUM_EXECUTABLE: ''
      - run: pnpm test:e2e
      - name: Browser failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          for report in Path('test-results').rglob('error-context.md'):
              print(report, report.read_text(), sep='\n')
          PYDIAG
      - run: python3 ../scripts/check-publication.py --dist
  payment-rails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-projects/project-0-payment-rails
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: python3 -m unittest discover -s tests -v
      - run: npm run build
      - run: python3 ../../scripts/check-publication.py --dist

  student-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test submitted student Python components
        shell: bash
        run: |
          set -euo pipefail
          run_tests() {
            local dir="$1"; shift
            echo "::group::Testing $dir"
            (cd "$dir" && timeout 90s python3 -m unittest "$@")
            echo "::endgroup::"
          }
          run_tests student-projects/ahmad-abuadas -v
          run_tests student-projects/huei-en-cho -v
          run_tests student-projects/card-fraud-screening-7f3c2a discover -s tests -t . -v
          run_tests student-projects/asim-khan -v
          run_tests student-projects/asim-khan/claim-intake-streamlit discover -s tests -v
          run_tests student-projects/personal-budget-c4e81a discover -s tests -v
          run_tests student-projects/eli-campbell/usf-fintech-digital-wallet discover -s tests -v
          run_tests student-projects/Investment-Research-Assistant-80123c -v
          run_tests student-projects/andreana.irving/usf-fintech-supplier-invoice discover -s tests -v
          run_tests student-projects/Ethan-Fray/bank-onboarding-checker-461cfa discover -s tests -v
  harborclaim-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: student-projects/asim-khan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - run: python3 -m pytest tests/test_app.py -q
  trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: student-projects/solana-trading-bot-538bd7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: student-projects/solana-trading-bot-538bd7/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Report unresolved production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
